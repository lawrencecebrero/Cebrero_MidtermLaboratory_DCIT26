{% extends 'app/base.html' %}
{% load static %}
{% block content %}
<br>
<h1>Blog Posts</h1>
<a href="{% url 'blog_create' %}" class="new-post-button">+ New Blog Post</a>
<div class="nav=right">
</div>
    {% for post in posts %}
        <div class="post-entry">
            <h2><a href="{% url 'blog_detail' post.pk %}">{{post.title}}</a></h2>
            <p>{{post.body}}</p>
        </div>
    {% endfor %}
{% endblock content %}
